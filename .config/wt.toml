# Worktrunk project configuration for parallel dev environments
# Docs: https://worktrunk.dev
#
# The logic lives in tool-agnostic scripts shared with orca.yaml; see
# scripts/worktree-setup.sh and scripts/worktree-teardown.sh.

[post-create]
setup = "scripts/worktree-setup.sh"

[pre-remove]
teardown = "scripts/worktree-teardown.sh"
