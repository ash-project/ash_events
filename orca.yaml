# Orca worktree hooks. The logic lives in tool-agnostic scripts shared with
# .config/wt.toml; see scripts/worktree-setup.sh and scripts/worktree-teardown.sh.
scripts:
  setup: |
    cd "$ORCA_WORKTREE_PATH" && scripts/worktree-setup.sh
  archive: |
    cd "$ORCA_WORKTREE_PATH" && scripts/worktree-teardown.sh
